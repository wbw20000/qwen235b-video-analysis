# 自动驾驶行为检测分析器 Deployment (CUDA MOG2 + FFmpeg NVDEC)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ads-behavior-analyzer
  namespace: traffic-vlm
  labels:
    app: ads-behavior-analyzer
    analysis-type: ads_behavior
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ads-behavior-analyzer
  template:
    metadata:
      labels:
        app: ads-behavior-analyzer
        analysis-type: ads_behavior
    spec:
      containers:
      - name: analyzer
        image: localhost:5000/semantic-analyzer:v11
        imagePullPolicy: Always
        command: ["python", "-m", "workers.ads_behavior_analyzer"]
        env:
        - name: REDIS_HOST
          value: "redis.traffic-vlm.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: EMBEDDING_SERVICE_URL
          value: "http://embedding-service.traffic-vlm.svc.cluster.local:8080"
        - name: VLM_PROXY_URL
          value: "http://vlm-proxy.traffic-vlm.svc.cluster.local:8001"
        - name: RESULTS_DIR
          value: "/data1/results"
        - name: MAX_TASKS
          value: "0"
        - name: CUDA_VISIBLE_DEVICES
          value: "3"
        - name: CUDA_DEVICE
          value: "0"
        - name: CLIP_SCORE_THRESHOLD
          value: "0.30"
        # MOG2 运动检测配置
        - name: USE_MOG2_FILTER
          value: "true"
        - name: MOG2_FG_RATIO_THRESHOLD
          value: "0.015"
        - name: MOG2_ALWAYS_SAMPLE_INTERVAL
          value: "5.0"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: videos
          mountPath: /data1/videos
          readOnly: true
        - name: results
          mountPath: /data1/results
      volumes:
      - name: videos
        persistentVolumeClaim:
          claimName: pvc-videos
      - name: results
        persistentVolumeClaim:
          claimName: pvc-results
