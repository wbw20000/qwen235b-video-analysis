# Embedding Service Deployment - SigLIP (3×T4 GPU 水平扩展)
# 每个 Pod 使用 1 个 GPU，K8S Service 自动负载均衡
apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-config
  namespace: traffic-vlm
data:
  MODEL_NAME: "google/siglip-base-patch16-384"
  MODEL_PATH: "/models/siglip-base-patch16-384"
  VECTOR_TTL: "3600"
  BATCH_SIZE: "32"
  MAX_REQUESTS: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: traffic-vlm
  labels:
    app: embedding-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
    spec:
      containers:
      - name: embedding
        image: localhost:5000/embedding-service:v17
        ports:
        - containerPort: 8080
          name: http
        env:
        # 使用 GPU 0-3，vLLM 固定使用 GPU 6,7
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3"
        - name: REDIS_HOST
          value: "redis.traffic-vlm.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MODEL_NAME
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MODEL_PATH
        - name: VECTOR_TTL
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: VECTOR_TTL
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: BATCH_SIZE
        - name: MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MAX_REQUESTS
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            # 不使用 nvidia.com/gpu，避免 Device Plugin 随机分配到 vLLM 的 GPU 4-7
            # 靠 CUDA_VISIBLE_DEVICES=0,1,2,3 控制 GPU 选择
          limits:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: pvc-models
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: traffic-vlm
spec:
  selector:
    app: embedding-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
# HPA 自动伸缩 - 根据CPU使用率在1-4个Pod之间自动调整
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-service-hpa
  namespace: traffic-vlm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
