# Embedding Service Deployment - SigLIP (3×T4 GPU 水平扩展)
# 每个 Pod 使用 1 个 GPU，K8S Service 自动负载均衡
apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-config
  namespace: traffic-vlm
data:
  MODEL_NAME: "google/siglip-base-patch16-384"
  MODEL_PATH: "/models/siglip-base-patch16-384"
  VECTOR_TTL: "3600"
  BATCH_SIZE: "32"
  MAX_REQUESTS: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: traffic-vlm
  labels:
    app: embedding-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
    spec:
      containers:
      - name: embedding
        image: localhost:5000/embedding-service:v17
        ports:
        - containerPort: 8080
          name: http
        env:
        # 限制只使用 GPU 0,1,2，避免与 vLLM (GPU 4-7) 冲突
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2"
        - name: REDIS_HOST
          value: "redis.traffic-vlm.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MODEL_NAME
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MODEL_PATH
        - name: VECTOR_TTL
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: VECTOR_TTL
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: BATCH_SIZE
        - name: MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: MAX_REQUESTS
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: pvc-models
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: traffic-vlm
spec:
  selector:
    app: embedding-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
# HPA 已禁用 - 固定 3 副本，每副本 1 GPU
# 如需动态扩展，需使用 GPU 指标 (nvidia-device-plugin metrics)
