# Edge Trigger Deployment - 边缘端事故预检测
# 注意: 此配置用于边缘 K8S 集群或中心测试环境
# 生产环境边缘端可能使用 Docker Compose 或独立部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-trigger
  namespace: traffic-vlm
  labels:
    app: edge-trigger
    tier: edge
spec:
  replicas: 1  # 每摄像头一个实例
  selector:
    matchLabels:
      app: edge-trigger
  template:
    metadata:
      labels:
        app: edge-trigger
        tier: edge
    spec:
      containers:
      - name: trigger
        image: localhost:5000/edge-trigger:latest
        args:
        - "--camera-id"
        - "$(CAMERA_ID)"
        - "--input-dir"
        - "/data1/videos/windows"
        - "--center-api-url"
        - "$(CENTER_API_URL)"
        env:
        # 摄像头 ID (每个部署实例不同)
        - name: CAMERA_ID
          value: "147-A"
        # 中心云 API 地址
        - name: CENTER_API_URL
          value: "http://api-gateway.traffic-vlm.svc.cluster.local:5000"
        # 边缘 Embedding 服务 (可选, 本地部署)
        - name: LOCAL_EMBEDDING_URL
          value: ""  # 留空则通过中心云 API
        # 触发阈值 (边缘用低阈值保证高召回)
        - name: EDGE_SIMILARITY_THRESHOLD
          value: "0.12"
        # 滑动窗口参数
        - name: EDGE_WINDOW_SIZE_SEC
          value: "60"
        - name: EDGE_SLIDE_INTERVAL_SEC
          value: "5"
        # 抽帧参数
        - name: EDGE_FRAME_SAMPLE_FPS
          value: "1.0"
        - name: EDGE_MAX_KEYFRAMES
          value: "5"
        # 自愈配置
        - name: MAX_TRIGGERS
          value: "1000"
        - name: POLL_INTERVAL_SEC
          value: "5"
        # Pod 名称
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: videos
          mountPath: /data1/videos
          readOnly: true
      volumes:
      - name: videos
        persistentVolumeClaim:
          claimName: pvc-videos
---
# Edge Trigger ConfigMap - 用于多摄像头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-trigger-config
  namespace: traffic-vlm
data:
  # 事故模板 (与中心云保持一致)
  accident_templates.json: |
    [
      "路口画面两辆机动车发生碰撞",
      "监控视频中汽车之间发生碰撞",
      "机动车追尾前车",
      "两车相撞，车辆受损",
      "十字路口车辆侧面碰撞",
      "路口画面机动车与二轮车发生碰撞",
      "监控视频中汽车与电动车发生碰撞",
      "机动车与自行车发生接触",
      "汽车与摩托车碰撞后骑车人摔倒",
      "路口机动车撞到电动车",
      "路口画面机动车与行人发生碰撞",
      "监控视频中汽车撞到行人",
      "机动车在人行横道撞到行人",
      "车辆与行人发生交通事故"
    ]
  # 阈值配置
  thresholds.yaml: |
    similarity_threshold: 0.12
    window_size_sec: 60
    slide_interval_sec: 5
    frame_sample_fps: 1.0
    max_keyframes: 5
