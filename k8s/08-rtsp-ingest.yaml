# RTSP Ingest Deployment - 每摄像头一个 Pod
# 示例: 147-A 摄像头
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-ingest-147a
  namespace: traffic-vlm
  labels:
    app: rtsp-ingest
    camera: "147-A"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtsp-ingest
      camera: "147-A"
  template:
    metadata:
      labels:
        app: rtsp-ingest
        camera: "147-A"
    spec:
      containers:
      - name: ingest
        image: localhost:5000/semantic-analyzer:v8
        command: ["python", "-m", "workers.rtsp_ingest"]
        args:
        - "--camera-id"
        - "147-A"
        - "--rtsp-url"
        - "rtsp://admin:baidu123@172.21.14.129:554/Streaming/Channels/102"
        - "--output-dir"
        - "/data1/videos/rtsp_recordings"
        - "--segment-duration"
        - "60"
        env:
        - name: REDIS_HOST
          value: "redis.traffic-vlm.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: videos
          mountPath: /data1/videos
      volumes:
      - name: videos
        persistentVolumeClaim:
          claimName: pvc-videos
---
# Dispatcher for 147-A (阶段1.5 - 重叠窗口)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-147a
  namespace: traffic-vlm
  labels:
    app: dispatcher
    camera: "147-A"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
      camera: "147-A"
  template:
    metadata:
      labels:
        app: dispatcher
        camera: "147-A"
    spec:
      containers:
      - name: dispatcher
        image: localhost:5000/semantic-analyzer:v8
        command: ["python", "-m", "workers.dispatcher"]
        args:
        - "--camera-id"
        - "147-A"
        - "--input-dir"
        - "/data1/videos/rtsp_recordings"
        - "--output-dir"
        - "/data1/videos/windows"
        - "--overlap-sec"
        - "10"
        - "--redis-host"
        - "redis.traffic-vlm.svc.cluster.local"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: videos
          mountPath: /data1/videos
      volumes:
      - name: videos
        persistentVolumeClaim:
          claimName: pvc-videos
